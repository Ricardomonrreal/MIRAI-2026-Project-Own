; Configuración de liblsl para MIRAI 2026: entorno LSL cerrado a esta PC.
; Solo se descubren y anuncian streams de la propia máquina (emulador, Aura.exe local, pipeline);
; los de otras PCs de la red (p. ej. host MSI con Aura abierto) quedan fuera.
; La cargan mock_lsl_streamer.py y check_lsl_stream.py vía LSLAPICFG; para usar la red (otro equipo
; leyendo el stream, p. ej. un visor AR), definir LSLAPICFG apuntando a otra configuración.
[multicast]
ResolveScope = machine
